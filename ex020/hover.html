<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Hover</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        div:hover {  /* Quando passar o mouse o texto muda de cor */
            color: red;
        }

        div > p {  /*a frase do paragrafo da div, se esconde na div */
            display: none;   /* comando para esconder o texto do paragrafo */
        }

        div:hover > p {   /* quando passar o mouse em cima, interage com o paragrafo */
            display: block;    /*comando para mostrar o texto do paragrafo */
            color: white;
            background-color: red;
            width: 200px;    /* largura */
        }  
    </style>
</head>
<body>
    <h1>Exemplo de hover</h1>
    <p>Passe o mouse sobre o texto abaixo</p>
    <div>Passe o mouse aqui
        <p>TEXTO ESCONDIDO...</p>
    </div>
    <p>Fim do exemplo</p>
</body>
</html>
