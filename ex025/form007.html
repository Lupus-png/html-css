<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário Novamente</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="iest">Estado</label>
            <select name="est" id="iest"> <!-- o select cria uma caixa de seleção -->

                <option value="">--- Escolha ---</option>   <!-- option cria uma opção de seleção, pro select -->
                <optgroup label="Região Sudeste">           <!-- o optgroup agrupa as opções e divide elas, com um titulo -->
                    <option value="MG">Minas Gerais</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="SP">São Paulo</option>
                </optgroup>

                <optgroup label="Região Sul">
                    <option value="PR">Paraná</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="SC">Santa Catarina</option>
                </optgroup>
            </select>
        </p>
        <p>
            <label for="iprof">Profissão: </label>  
            <input type="text" name="prof" id="iprof" list="lstprof">   <!-- o list, serve pra criar uma ligação com o datalist, que deve ser o mesmo do id -->
            <datalist id="lstprof">    <!-- o datalist cria uma lista de sugestões para o usuario, na texto box, o id é o mesmo do list -->
                <option value="ADM">Administrador</option>  <!-- Dentro de value aparece o codigo que vai ser enviado, se selecionado a opção -->
                <option value="CONT">Contabilista</option>
                <option value="DEV">Desenvolvedor</option>
                <option value="PROF">Professor</option>
            </datalist>
        </p>
        <p>
            <label for="imsg">Mensagem: </label><br>
            <textarea name="msg" id="imsg" cols="30" rows="10" placeholder="Sua mensagem aqui..."></textarea>   <!-- o textarea é uma caixa de texto grande, podendo ser ajustada com as rows e cols -->
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
