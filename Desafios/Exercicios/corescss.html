<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cores em CSS</title>
</head>
<body>
    <h1>Cores em CSS</h1>
    <p>Para entende esse exercício, olem bem atentamente ao código fonte do arquivo.</p>
    <h2 style="background-color: darkblue; color: white;">Este titulo usa cores de nome</h2>
    <h2 style="background-color: #00008b; color: #ffffff;">Ja este usa cores exadecimal</h2>
    <h2 style="background-color: rgb(00, 00, 139); color: rgb(255, 255, 255);">este outro usa RGB</h2>
    <h2 style="background-color: hsl(240, 100%, 27%); color: hsl(0, 0%, 100%);">Esse outro usa HSL</h2>
    <h2 style="background-color: rgb(00, 00, 139, 0.5); color: white;">Nesse titulo, fundo azul e transparencia em 50%</h2>
</body>
</html>
