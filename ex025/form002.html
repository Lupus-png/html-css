<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">  <!-- post e get, sendo post para conteudo discreto e post para conteudo basico em formularios -->
        <p>
            <label for="iusu">Usuário: </label>
            <input type="text" name="usu" id="iusu" required minlength="4" maxlength="18" size="12" placeholder="Nome do usuário" autocomplete="username">
            <!-- required não permite deixar sem preencher -->
            <!-- minlength numero minimo de caracteres -->
            <!-- maxlength numero maximo de caracteres -->
            <!-- size é o tamanho da caixa -->
            <!-- placeholder um texto dentro da caixa, como uma orientação -->
            <!-- usarname é um nome de usuario ja salvo -->
        </p>
        <p>
            <label for="isen">Senha :</label>
            <input type="password" name="sen" id="isen" required minlength="8" maxlength="16" size="8" placeholder="Min 8 digitos" autocomplete="current-password">
            <!-- new-password é para senhas novas e current-password é para senhas ja cadastradas -->
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar"> <!-- reset cria um botão de apagar todos os dados do formulario -->
        </p>
    </form>
</body>
</html>
