<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tangerine:wght@400;700&display=swap');

        @font-face {
            font-family: OldLondon;
            src: url(OldLondonAlternate.ttf) format("truetype"); 
        }

        #sistema {
            font-family: Arial, Helvetica, sans-serif;
            font-weight: normal;
        }

        #google {
            font-family: "Tangerine", cursive;
            font-size: 38px;
        }

        #local {
            font-family: OldLondon;
            font-weight: normal;
            font-size: 34px;
        }
    </style>
</head>
<body>
    <h1>Fontes em CSS</h1>
    <h2 id="sistema">Podemos Configurar fontes padrão do sistema</h2>
    <h2 id="google">Ou então usar uma fonte do Google Fonts</h2>
    <h2 id="local">Ou ainda usar um arquivo local de fontes</h2>
</body>
</html>
