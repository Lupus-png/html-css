<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;

            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;

            flex-basis: 200px; /* Tamanho padrão de cada item */
            flex-shrink: 1; /* Pode encolhe os itens do conteiner */
            flex-grow: 0; /* Pode cresce os itens no conteiner */
        }
        div#box1 {
            flex-shrink: 0;
            flex-grow: 0;
        }

        div#box2 {
            flex-shrink: 1;
            flex-grow: 2;
        }

        div#box3 {
            flex-shrink: 8;
            flex-grow: 4;
        }

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="box1">A</div>
        <div class="item" id="box2">B</div>
        <div class="item" id="box3">C</div>

    </div>
</body>
</html>
