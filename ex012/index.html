<!DOCTYPE html>
<html lang="pt-bt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos em HTML5</title>
</head>
<body>
    <h1>Inserindo Videos Hospedados Localmente</h1>
    <p>Esse video esta hospedado no meu proprio servidor.</p>
    <video width="560" poster="imagens/cat-tumb.jpg" preload="none" controls muted autoplay loop>
        <source src="midia/Cat webm.webm" type="video/webm">
        <source src="midia/Cat mp4.mp4" type="video/mp4">
        <p>Infelizmente seu navegador não é compativel com reprodução de videos.</p>
    </video>
    <h1>Inserindo Videos do Youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/OzUnqQk4eOg?si=vgkthapYT5wmsN__" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
