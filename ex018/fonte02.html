<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {       /* encaminha fontes baixadas */
            font-family: "OldLondon";
            src: url("fonts/OldLondon.ttf") format("Truetype");
            /*
            Tipos de format()
            -opentype (orf)
            -truetype (ttf)
            -embedded-opentype
            -truetype-aat (apple advenced typography)
            -svg
            */
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        p {
            font-family:"OldLondon","times", serif;
            font-size: 1.5em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Titulo</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Natus, placeat, at ex quaerat cupiditate enim ut alias sapiente tempore iure maxime non tenetur quidem necessitatibus esse eveniet quam architecto blanditiis.</p>
</body>
</html>
