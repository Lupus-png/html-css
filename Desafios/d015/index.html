<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <title>Login</title>
</head>
<body>
    <main>
        <section>
            <div id="imagem">
            </div>              
            <div id="formulario">
                <form action="login" method="post" autocomplete="on">
                    <h1>Login</h1>
                    <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p> 
                    <p class="fundo">
                        <span class="material-symbols-outlined">account_circle</span>
                        <input type="email" class="campo" name="email" id="iemail" placeholder="Seu e-mail" maxlength="30" required size="23">
                        <label for="iemail"></label>
                    </p>
                    <p class="fundo">
                        <span class="material-symbols-outlined">vpn_key</span>
                        <input type="password" class="campo" name="senha" id="isenha" minlength="8" maxlength="20" placeholder="Sua senha" required size="23">
                        <label for="isenha"></label>
                    </p>
                        <input type="submit" value="Entrar" id="entrar">
                        <a href="#">Esqueci a Senha <span class="material-symbols-outlined" id="mail">mail</span></a>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
