<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relogio Digital</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap');

        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
            font-family: 'Open Sans', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(120deg,#ffe53bd8, #ff2525da);
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            justify-content: center;
        }

        header {
            color: white;
        }
        header > p {
            font-size: 30px;
            font-weight: lighter;
        }

        main {
            display: flex;
            align-items: center;
            justify-content: space-around;
            height: 200px;
            width: 550px;
            background: transparent;
            border-radius: 3px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.418);
        }

        main > div {
            height: 170px;
            width: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            background-color: rgba(5, 5, 5, 0.9);
            box-shadow: 5px 5px 15px rgba(0, 0, 0, .7);
            border-radius: 7px;
            letter-spacing: 3px;
        }

        p {
            font-weight: bolder;
            font-size: 60px;
        }

        .tempo {
            font-size: 11px;
        }

        footer {
            display: flex;
            color: white;
        }
        footer > p {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <header>
        <p id="data">Data</p>
    </header>
    <main>
        <div>
            <p id="horas">00</p>
            <p class="tempo">Horas</p>
        </div>
        <div>
            <p id="minutos">00</p>
            <p class="tempo">Minutos</p>
        </div>
        <div>
            <p id="segundos">00</p>
            <p class="tempo">Segundos</p>
        </div>
    </main>
    <footer>
        <p>Lupus_png</p>
    </footer>
<script>
    const horas = document.getElementById('horas');
    const minutos = document.getElementById('minutos');
    const segundos = document.getElementById('segundos');
    const data = document.getElementById('data');

    const relogio = setInterval(function time() {
        let dateToday = new Date();
        let hr = dateToday.getHours();
        let min = dateToday.getMinutes();
        let sec = dateToday.getSeconds();
        let dat = dateToday.toLocaleDateString('pt-BR');

        if(hr < 10) hora = "0" + hr;
        if(min < 10) min = "0" + min;
        if(sec < 10) sec = "0" + sec;

        if(hr < 6) {
            document.body.style.background = "linear-gradient(300deg, #1B1F38, #F3A17E)"
        } else if(hr < 12) {
            document.body.style.background = "lienar-gradient(300deg, #57C1EB, #FAD961)"
        } else if (hr < 18) {
            document.body.style.background = "linear-gradient(300deg, #34495E, #F3DB9F"
        } else {
            document.body.style.background = "linear-gradient(300deg, #0F2027, #203A43)"
        }

        horas.textContent = hr;
        minutos.textContent = min;
        segundos.textContent = sec;
        data.textContent = dat;
    })
</script>
</html>
