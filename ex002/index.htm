<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragrafos</title>
</head>
<body>
    <h1>Paragrafos e quebras de linha</h1>
    <hr>
    <p>Você pode criar um paragrafo de qualquer jeito, basta colocar tudo no meio de par de tags &lt;p&gt; e &lt;/p&gt;</p> <!--LESS THAN/GREATER THAN-->
    <p>Se quiser quebrar a linha no meio tipo, aqui <br> apenas use o comando br</p>
    <P>Vamos adicionar alguns simbolos especiais:
        &reg;  <!--Sigla marca-registrada-->
        &copy; <!--Sigla copyright-->
        &trade;<!--Sigla Trade Marketing(Marca registrada em ingles)-->
        <!--Moedas-->
        &euro;
        &yen;
        &cent;
        &Delta;<!--Simbolo de delta(precisa ter D em maiusculo)-->
    </P>
    <p>Vamos adicionar alguns emojis <!--Emojis sempre começam com "&#x"-->
        &#x1F596;
        &#x1F913;
        &#x1F4BB;
    </p>
</body>
</html>
